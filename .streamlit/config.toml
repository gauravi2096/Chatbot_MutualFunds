# Streamlit config for INDmoney Fund Chat (Streamlit Cloud).
# https://docs.streamlit.io/develop/api-reference/configuration

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Light mode default; "cool trust" app colors (slate/navy + teal accent)
[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0f172a"
font = "sans serif"
